[project]
name = "finance"
version = "0.1.0"
description = "Local personal finance MVP on top of Pluggy (Open Finance Brasil)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
finance = "finance.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, bandit (security)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "B008",  # FastAPI: Depends(...) in argument defaults is the framework's idiom
    "E741",  # `l` for a link/line in short comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "E731", "E501"]  # asserts, fake credentials, data literals

[tool.ruff.lint.isort]
known-first-party = ["finance"]

[tool.mypy]
python_version = "3.12"
files = ["src/finance"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["finance"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true
